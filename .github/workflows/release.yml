name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Собрать установщики
        run: |
          mkdir -p dist
          cd installer
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/beresta-install-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/beresta-install-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/beresta-install-windows-amd64.exe .

      - name: Собрать компилятор
        run: |
          make
          tar -czf dist/beresta-linux-amd64.tar.gz -C build berestac
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Проверить компилятор
        run: |
          ./build/berestac version
          ./build/berestac run examples/привет.бер

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Артефакты без тега
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: beresta-dist
          path: dist/*

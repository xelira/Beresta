name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Собрать установщики
        run: |
          mkdir -p dist
          cd installer
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/beresta-install-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/beresta-install-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/beresta-install-windows-amd64.exe .

      - name: Собрать компилятор
        run: |
          make
          tar -czf dist/beresta-linux-amd64.tar.gz -C build berestac

      - name: Собрать нативный компилятор для Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
          make berestac-windows CROSS=x86_64-w64-mingw32-g++
          cp build/berestac.exe dist/berestac-windows-amd64.exe

      - name: Проверить Windows-сеть
        run: |
          ./build/berestac build examples/сайт.бер --target windows -o /tmp/site.exe
          ./build/berestac build examples/срезы.бер --target windows -o /tmp/slices.exe
          ./build/berestac build examples/словарь.бер --target windows -o /tmp/map.exe
          ./build/berestac build examples/json.бер --target windows -o /tmp/json.exe
          file /tmp/site.exe /tmp/slices.exe /tmp/map.exe /tmp/json.exe

      - name: Собрать лаунчеры
        run: |
          cp build/berestac cli/berestac
          (cd cli && CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -tags bundle -trimpath -ldflags "-s -w" -o ../dist/beresta-linux-amd64 .)
          rm -f cli/berestac
          (cd cli && CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/beresta-linux-arm64 .)
          (cd cli && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/beresta-windows-amd64.exe .)

      - name: Собрать бандл
        run: |
          mkdir -p bundle
          cp dist/beresta-linux-amd64 bundle/beresta
          cp build/berestac bundle/berestac
          cp build/berestac.exe bundle/berestac.exe
          cp README.md ЯЗЫК.md bundle/
          cp -r examples bundle/
          tar -czf dist/beresta-bundle-linux-amd64.tar.gz -C bundle .

      - name: Проверить
        run: |
          ./build/berestac version
          ./dist/beresta-linux-amd64 run examples/привет.бер
          ./dist/beresta-linux-amd64 run examples/модули.бер

      - name: Контрольные суммы
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Артефакты без тега
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: beresta-dist
          path: dist/*
